name: build-kayo
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK (mainline debug, pacote .kayo)
        run: ./gradlew assembleMainlineDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-kayo
          path: app/build/outputs/apk/mainline/debug/*.apk
